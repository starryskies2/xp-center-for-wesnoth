#textdomain wesnoth-XP_Control_Center

[modification]
    id=xp_control_center
    name="XP Control Center"
    description="Lightweight campaign-wide XP controls with an in-game settings window. Right-click your leader and choose XP Control Center to change settings. XP caps persist on units and refresh only after advancement/AMLA."
    type=sp
    require_modification=yes

    [options]
        # ==================== ALLIES ====================
        [checkbox]
            id=xcc_player_cap_enabled
            name="ALLIES - Enable XP cap"
            description="Apply an XP requirement cap to your non-leader units."
            default=yes
        [/checkbox]

        [slider]
            id=xcc_player_cap
            name="ALLIES - Maximum XP required"
            description="Your non-leader units will never require more XP than this value to advance. Lower natural requirements are left unchanged."
            default=500
            min=25
            max=5000
            step=25
        [/slider]

        [slider]
            id=xcc_player_rate
            name="ALLIES - Combat XP gain (%)"
            description="100 is normal combat XP, 200 is double, 300 is triple, up to 500%."
            default=100
            min=100
            max=500
            step=25
        [/slider]

        # ==================== LEADER ====================
        [checkbox]
            id=xcc_separate_leaders
            name="LEADER - Use separate settings"
            description="If disabled, your leaders use the ALLIES cap and combat XP settings."
            default=yes
        [/checkbox]

        [checkbox]
            id=xcc_leader_cap_enabled
            name="LEADER - Enable XP cap"
            description="Apply a separate XP requirement cap to your units with canrecruit=yes."
            default=yes
        [/checkbox]

        [slider]
            id=xcc_leader_cap
            name="LEADER - Maximum XP required"
            description="Maximum XP required by your leaders when separate leader settings are enabled."
            default=500
            min=25
            max=5000
            step=25
        [/slider]

        [slider]
            id=xcc_leader_rate
            name="LEADER - Combat XP gain (%)"
            description="Combat XP multiplier for your leaders when separate leader settings are enabled."
            default=100
            min=100
            max=500
            step=25
        [/slider]

        # ==================== HEALERS ====================
        [checkbox]
            id=xcc_healing_xp_enabled
            name="HEALERS - Gain XP from healing"
            description="Your healers gain XP when an adjacent same-side ally actually gains HP during normal start-of-turn healing."
            default=yes
        [/checkbox]

        [slider]
            id=xcc_healing_xp_per_unit
            name="HEALERS - XP per healed ally"
            description="XP awarded to each eligible healer for each adjacent same-side ally whose HP increased during normal start-of-turn healing."
            default=1
            min=1
            max=25
            step=1
        [/slider]

        # ==================== ENEMY ====================
        [checkbox]
            id=xcc_enemies_enabled
            name="ENEMY - Modify enemy XP"
            description="Enable XP cap and combat XP controls for sides that are enemies of a human-controlled side. AI allies are not affected."
            default=no
        [/checkbox]

        [checkbox]
            id=xcc_enemy_cap_enabled
            name="ENEMY - Enable XP cap"
            description="Apply an XP requirement cap to enemy units, including enemy leaders."
            default=yes
        [/checkbox]

        [slider]
            id=xcc_enemy_cap
            name="ENEMY - Maximum XP required"
            description="Maximum XP required by enemy units when enemy XP modification is enabled."
            default=500
            min=25
            max=5000
            step=25
        [/slider]

        [slider]
            id=xcc_enemy_rate
            name="ENEMY - Combat XP gain (%)"
            description="Combat XP multiplier for enemy units when enemy XP modification is enabled."
            default=100
            min=100
            max=500
            step=25
        [/slider]
    [/options]

    [lua]
        code=<<
            wesnoth.require("~add-ons/XP_Control_Center/lua/main.lua")
        >>
    [/lua]

    # Re-check the cap whenever a unit is placed on the map. This intentionally
    # also runs for units already initialized: special AMLAs/campaign code may
    # rebuild or unstore an existing unit and restore its natural max_experience.
    # initialize_unit() preserves the stored natural XP value and only reapplies
    # the selected cap, so this does not stack or double-apply anything.
    [event]
        id=xcc_first_placement
        name=unit placed
        first_time_only=no
        priority=-1000
        [xcc_initialize_unit]
        [/xcc_initialize_unit]
    [/event]

    # Track healers incrementally. StandardUnitFilter handles the ability check
    # before Lua is called, so non-healers do not enter this handler.
    [event]
        id=xcc_healer_placed
        name=unit placed
        first_time_only=no
        priority=-900
        [filter_condition]
            [variable]
                name=xcc_runtime_healing_xp_enabled
                boolean_equals=yes
            [/variable]
        [/filter_condition]
        [filter]
            ability_type=heals
        [/filter]
        [xcc_track_healer]
        [/xcc_track_healer]
    [/event]

    # Both normal advancement and AMLA fire post advance. Reapply the cap only to
    # this unit and refresh its healer-cache membership because abilities may change.
    [event]
        id=xcc_post_advance
        name=post advance
        first_time_only=no
        priority=-1000
        [xcc_after_advance]
        [/xcc_after_advance]
    [/event]

    # Remove dead healers from the transient cache immediately.
    [event]
        id=xcc_healer_die
        name=die
        first_time_only=no
        priority=-1000
        [filter_condition]
            [variable]
                name=xcc_runtime_healing_xp_enabled
                boolean_equals=yes
            [/variable]
        [/filter_condition]
        [filter]
            ability_type=heals
        [/filter]
        [xcc_remove_healer]
        [/xcc_remove_healer]
    [/event]

    # Combat XP touches only attacker and defender. No unit-list scans.
    [event]
        id=xcc_attack_begin
        name=attack
        first_time_only=no
        priority=1000
        [xcc_attack_begin]
        [/xcc_attack_begin]
    [/event]

    [event]
        id=xcc_attack_end
        name=attack end
        first_time_only=no
        priority=-1000
        [xcc_attack_end]
        [/xcc_attack_end]
    [/event]

    # Healing XP uses only cached healer IDs. There is no find_on_map scan here.
    [event]
        id=xcc_healing_snapshot
        name=side turn
        first_time_only=no
        priority=1000
        [filter_condition]
            [variable]
                name=xcc_runtime_healing_xp_enabled
                boolean_equals=yes
            [/variable]
        [/filter_condition]
        [xcc_healing_snapshot]
        [/xcc_healing_snapshot]
    [/event]

    [event]
        id=xcc_healing_award
        name=turn refresh
        first_time_only=no
        priority=1000
        [filter_condition]
            [variable]
                name=xcc_runtime_healing_xp_enabled
                boolean_equals=yes
            [/variable]
        [/filter_condition]
        [xcc_healing_award]
        [/xcc_healing_award]
    [/event]

    # Lua caches are transient and disappear on save/load. Rebuild only the
    # healer-ID cache during preload; this does not recalculate XP caps.
    [event]
        id=xcc_preload_cache
        name=preload
        first_time_only=no
        [xcc_preload]
        [/xcc_preload]
    [/event]

    # One right-click entry on human leaders opens the complete settings window.
    [event]
        id=xcc_menu_setup
        name=prestart
        first_time_only=no
        priority=1000
        [set_menu_item]
            id=xcc_control_center_menu
            description="XP Control Center"
            use_hotkey=no
            [filter_location]
                [filter]
                    canrecruit=yes
                    [filter_side]
                        controller=human
                    [/filter_side]
                [/filter]
            [/filter_location]
            [command]
                [xcc_open_settings]
                [/xcc_open_settings]
            [/command]
        [/set_menu_item]
    [/event]

    [event]
        id=xcc_scenario_end
        name=scenario end
        first_time_only=no
        priority=-1000
        [xcc_scenario_end]
        [/xcc_scenario_end]
    [/event]
[/modification]

#textdomain wesnoth-XP_Control_Center

[resolution]
    definition="default"
    automatic_placement=yes
    vertical_placement="center"
    horizontal_placement="center"
    maximum_width=820
    maximum_height=760

    [tooltip]
        id="tooltip"
    [/tooltip]
    [helptip]
        id="tooltip"
    [/helptip]

    [grid]
        [row]
            [column]
                grow_factor=1
                horizontal_alignment="left"
                border="all"
                border_size=8
                [label]
                    id="xcc_title"
                    definition="title"
                    label="XP Control Center"
                [/label]
            [/column]
        [/row]

        [row]
            [column]
                grow_factor=1
                horizontal_grow=yes
                border="left,right,bottom"
                border_size=8
                [grid]
                    # ==================== ALLIES ====================
                    [row]
                        [column]
                            horizontal_alignment="left"
                            border="top,bottom"
                            border_size=4
                            [label]
                                id="xcc_allies_header"
                                label="ALLIES"
                                definition="title"
                            [/label]
                        [/column]
                        [column]
                            [spacer]
                                width=20
                            [/spacer]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            [label]
                                label="Enable XP cap"
                            [/label]
                        [/column]
                        [column]
                            horizontal_alignment="left"
                            [toggle_button]
                                id="xcc_gui_player_cap_enabled"
                                definition="default"
                                tooltip="Cap the XP required for your non-leader units."
                            [/toggle_button]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            [label]
                                label="Maximum XP required"
                            [/label]
                        [/column]
                        [column]
                            horizontal_grow=yes
                            [slider]
                                id="xcc_gui_player_cap"
                                definition="default"
                                minimum_value=25
                                maximum_value=5000
                                step_size=25
                                tooltip="Lower natural requirements stay unchanged."
                            [/slider]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            border="bottom"
                            border_size=8
                            [label]
                                label="Combat XP gain (%)"
                            [/label]
                        [/column]
                        [column]
                            horizontal_grow=yes
                            border="bottom"
                            border_size=8
                            [slider]
                                id="xcc_gui_player_rate"
                                definition="default"
                                minimum_value=100
                                maximum_value=500
                                step_size=25
                                tooltip="100 is normal XP, 200 is double, up to 500%."
                            [/slider]
                        [/column]
                    [/row]

                    # ==================== LEADER ====================
                    [row]
                        [column]
                            horizontal_alignment="left"
                            border="top,bottom"
                            border_size=4
                            [label]
                                id="xcc_leader_header"
                                label="LEADER"
                                definition="title"
                            [/label]
                        [/column]
                        [column]
                            [spacer]
                                width=20
                            [/spacer]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            [label]
                                label="Use separate leader settings"
                            [/label]
                        [/column]
                        [column]
                            horizontal_alignment="left"
                            [toggle_button]
                                id="xcc_gui_separate_leaders"
                                definition="default"
                                tooltip="When off, leaders use ALLIES settings."
                            [/toggle_button]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            [label]
                                label="Enable leader XP cap"
                            [/label]
                        [/column]
                        [column]
                            horizontal_alignment="left"
                            [toggle_button]
                                id="xcc_gui_leader_cap_enabled"
                                definition="default"
                            [/toggle_button]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            [label]
                                label="Leader maximum XP"
                            [/label]
                        [/column]
                        [column]
                            horizontal_grow=yes
                            [slider]
                                id="xcc_gui_leader_cap"
                                definition="default"
                                minimum_value=25
                                maximum_value=5000
                                step_size=25
                            [/slider]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            border="bottom"
                            border_size=8
                            [label]
                                label="Leader combat XP gain (%)"
                            [/label]
                        [/column]
                        [column]
                            horizontal_grow=yes
                            border="bottom"
                            border_size=8
                            [slider]
                                id="xcc_gui_leader_rate"
                                definition="default"
                                minimum_value=100
                                maximum_value=500
                                step_size=25
                            [/slider]
                        [/column]
                    [/row]

                    # ==================== HEALERS ====================
                    [row]
                        [column]
                            horizontal_alignment="left"
                            border="top,bottom"
                            border_size=4
                            [label]
                                id="xcc_healers_header"
                                label="HEALERS"
                                definition="title"
                            [/label]
                        [/column]
                        [column]
                            [spacer]
                                width=20
                            [/spacer]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            [label]
                                label="Gain XP from healing"
                            [/label]
                        [/column]
                        [column]
                            horizontal_alignment="left"
                            [toggle_button]
                                id="xcc_gui_healing_xp_enabled"
                                definition="default"
                                tooltip="Award XP when an adjacent same-side ally actually heals."
                            [/toggle_button]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            border="bottom"
                            border_size=8
                            [label]
                                label="XP per healed ally"
                            [/label]
                        [/column]
                        [column]
                            horizontal_grow=yes
                            border="bottom"
                            border_size=8
                            [slider]
                                id="xcc_gui_healing_xp_per_unit"
                                definition="default"
                                minimum_value=1
                                maximum_value=25
                                step_size=1
                            [/slider]
                        [/column]
                    [/row]

                    # ==================== ENEMY ====================
                    [row]
                        [column]
                            horizontal_alignment="left"
                            border="top,bottom"
                            border_size=4
                            [label]
                                id="xcc_enemy_header"
                                label="ENEMY"
                                definition="title"
                            [/label]
                        [/column]
                        [column]
                            [spacer]
                                width=20
                            [/spacer]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            [label]
                                label="Modify enemy XP"
                            [/label]
                        [/column]
                        [column]
                            horizontal_alignment="left"
                            [toggle_button]
                                id="xcc_gui_enemies_enabled"
                                definition="default"
                                tooltip="Affects sides that are enemies of a human-controlled side."
                            [/toggle_button]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            [label]
                                label="Enable enemy XP cap"
                            [/label]
                        [/column]
                        [column]
                            horizontal_alignment="left"
                            [toggle_button]
                                id="xcc_gui_enemy_cap_enabled"
                                definition="default"
                            [/toggle_button]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            [label]
                                label="Enemy maximum XP"
                            [/label]
                        [/column]
                        [column]
                            horizontal_grow=yes
                            [slider]
                                id="xcc_gui_enemy_cap"
                                definition="default"
                                minimum_value=25
                                maximum_value=5000
                                step_size=25
                            [/slider]
                        [/column]
                    [/row]
                    [row]
                        [column]
                            horizontal_alignment="left"
                            [label]
                                label="Enemy combat XP gain (%)"
                            [/label]
                        [/column]
                        [column]
                            horizontal_grow=yes
                            [slider]
                                id="xcc_gui_enemy_rate"
                                definition="default"
                                minimum_value=100
                                maximum_value=500
                                step_size=25
                            [/slider]
                        [/column]
                    [/row]
                [/grid]
            [/column]
        [/row]

        [row]
            [column]
                horizontal_alignment="right"
                border="all"
                border_size=8
                [grid]
                    [row]
                        [column]
                            border="right"
                            border_size=5
                            [button]
                                id="ok"
                                definition="default"
                                label="Save"
                            [/button]
                        [/column]
                        [column]
                            [button]
                                id="cancel"
                                definition="default"
                                label="Cancel"
                            [/button]
                        [/column]
                    [/row]
                [/grid]
            [/column]
        [/row]
    [/grid]
[/resolution]
